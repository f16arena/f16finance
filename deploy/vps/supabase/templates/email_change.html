<h2>Подтверждение смены email</h2>
<p>Здравствуйте!</p>
<p>Вы запросили смену email с <b>{{ .Email }}</b> на <b>{{ .NewEmail }}</b>.</p>
<p>Для подтверждения нажмите на ссылку ниже:</p>
<p><a href="{{ .ConfirmationURL }}">Подтвердить смену email</a></p>
<p>Если это были не вы, не переходите по ссылке.</p>
