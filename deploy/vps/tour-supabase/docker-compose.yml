# Своя база Tour (tournament.f16-arena.kz) на cloud-001 вместо Supabase Cloud (Сидней).
# Облегчённый стек из тех же образов, что у Orda (/opt/supabase/orda): Postgres + PostgREST
# + Storage. Auth/Realtime/Studio Tour не нужны (вход через Steam, свои сессии).
# Шлюза нет: PostgREST и Storage сами проверяют JWT; снаружи — Caddy, db.f16-arena.kz.
# Запуск: cd /opt/supabase/tour && docker compose up -d   (.env — ключи, 600)
name: tour-supabase

services:
  db:
    container_name: tour-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./init/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./init/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./init/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: 3600
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    ports:
      - 127.0.0.1:5440:5432
    logging: { driver: json-file, options: { max-size: 20m, max-file: "3" } }

  rest:
    container_name: tour-rest
    image: postgrest/postgrest:v14.17
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public,storage,graphql_public
      PGRST_DB_MAX_ROWS: 1000
      PGRST_DB_EXTRA_SEARCH_PATH: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_APP_SETTINGS_JWT_EXP: 3600
    command: ["postgrest"]
    ports:
      - 127.0.0.1:8210:3000
    logging: { driver: json-file, options: { max-size: 20m, max-file: "3" } }

  storage:
    container_name: tour-storage
    image: supabase/storage-api:v1.74.0
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      rest: { condition: service_started }
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      POSTGREST_URL: http://rest:3000
      AUTH_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      STORAGE_PUBLIC_URL: https://db.f16-arena.kz
      REQUEST_ALLOW_X_FORWARDED_PATH: "true"
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      GLOBAL_S3_BUCKET: stub
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      ENABLE_IMAGE_TRANSFORMATION: "false"
    volumes:
      - ./volumes/storage:/var/lib/storage:z
    ports:
      - 127.0.0.1:8211:5000
    logging: { driver: json-file, options: { max-size: 20m, max-file: "3" } }

volumes:
  db-config:
